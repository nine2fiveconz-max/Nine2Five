<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — Nine2Five</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F6F2EC; --fg: #1A1714; --accent: #2C5E2E; --gold: #B8893A;
      --muted: #8A7F74; --border: #E2D9CE; --white: #FDFBF8; --font: 'Outfit', sans-serif;
    }
    body {
      background: var(--bg); color: var(--fg); font-family: var(--font);
      min-height: 100dvh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 2rem; text-align: center;
    }
    .check {
      width: 64px; height: 64px; background: var(--accent); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 2rem;
    }
    .check svg { color: white; }
    h1 { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 900; letter-spacing: -0.04em; margin-bottom: 1rem; }
    h1 span { color: var(--accent); }
    p { font-size: 1rem; color: var(--muted); max-width: 38ch; line-height: 1.7; margin: 0 auto 2.5rem; }
    .proverb {
      border-top: 1px solid var(--border); padding-top: 2rem; margin-top: 1rem;
      font-size: 0.875rem; color: var(--muted); font-style: italic; max-width: 42ch; margin-inline: auto;
    }
    a {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: var(--accent); color: white; padding: 0.85rem 2rem;
      border-radius: 100px; font-size: 0.9rem; font-weight: 600; text-decoration: none;
      transition: background 0.2s, transform 0.15s;
    }
    a:hover { background: #1e4420; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="check">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
      <path d="M6 14l6 6 10-12" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <h1>Kia ora — <span>order confirmed!</span></h1>
  <p>Your Nine2Five socks are on their way. A confirmation has been sent to your email.</p>
  <a href="/">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M12 7H2M6 3l-4 4 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Back to shop
  </a>
  <p class="proverb">"Nāu te rourou, nāku te rourou, ka ora ai te iwi."<br>With your basket and my basket, the people will thrive.</p>
</body>
</html>
