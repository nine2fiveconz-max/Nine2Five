<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — Nine2Five</title>
  <script src="https://js.stripe.com/v3/"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F6F2EC; --fg: #1A1714; --accent: #2C5E2E; --gold: #B8893A;
      --muted: #8A7F74; --border: #E2D9CE; --white: #FDFBF8; --error: #c0392b;
      --font: 'Outfit', sans-serif;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.5; min-height: 100dvh; }

    /* ── NAV ── */
    nav {
      position: sticky; top: 0; z-index: 50;
      padding: 1.1rem 2.5rem; display: flex; align-items: center; justify-content: space-between;
      background: rgba(246,242,236,0.95); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-brand { font-size: 1.125rem; font-weight: 700; letter-spacing: -0.03em; text-decoration: none; color: var(--fg); }
    .nav-brand span { color: var(--accent); }
    .nav-steps { display: flex; align-items: center; gap: 0.5rem; font-size: 0.75rem; font-weight: 600; color: var(--muted); }
    .nav-steps .step-active { color: var(--accent); }
    .nav-back { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8125rem; font-weight: 500; color: var(--muted); text-decoration: none; transition: color 0.2s; }
    .nav-back:hover { color: var(--fg); }

    /* ── LAYOUT ── */
    .checkout-grid { display: grid; grid-template-columns: 1fr 500px; min-height: calc(100dvh - 62px); }

    /* ── LEFT: ORDER SUMMARY ── */
    .summary-panel { padding: 3rem 3rem 3rem 4rem; border-right: 1px solid var(--border); background: var(--bg); }
    .summary-label { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 2rem; }
    .order-items { display: flex; flex-direction: column; gap: 0; margin-bottom: 2rem; }
    .order-item { display: grid; grid-template-columns: 64px 1fr auto; gap: 1rem; padding: 1.25rem 0; border-bottom: 1px solid var(--border); align-items: center; }
    .order-item:first-child { border-top: 1px solid var(--border); }
    .order-item-img { width: 64px; height: 80px; border-radius: 0.5rem; overflow: hidden; background: var(--white); position: relative; }
    .order-item-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .qty-bubble { position: absolute; top: -6px; right: -6px; background: var(--fg); color: white; border-radius: 100px; font-size: 0.6rem; font-weight: 700; min-width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; padding: 0 4px; }
    .order-item-name { font-size: 0.875rem; font-weight: 600; letter-spacing: -0.01em; }
    .order-item-meta { font-size: 0.75rem; color: var(--muted); margin-top: 0.15rem; }
    .order-item-price { font-size: 0.9rem; font-weight: 700; letter-spacing: -0.02em; }
    .summary-totals { margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.6rem; }
    .total-row { display: flex; justify-content: space-between; font-size: 0.875rem; color: var(--muted); }
    .total-row.grand { border-top: 1px solid var(--border); padding-top: 0.75rem; margin-top: 0.25rem; font-size: 1.1rem; font-weight: 700; color: var(--fg); letter-spacing: -0.02em; }
    .total-row.grand span:last-child { font-size: 1.25rem; }
    .trust-badges { margin-top: 2.5rem; display: flex; flex-direction: column; gap: 0.6rem; }
    .trust-badge { display: flex; align-items: center; gap: 0.6rem; font-size: 0.75rem; color: var(--muted); }

    /* ── RIGHT: FORM ── */
    .payment-panel { padding: 3rem; background: var(--white); display: flex; flex-direction: column; overflow-y: auto; }

    .form-section { margin-bottom: 2rem; }
    .form-section-title {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 1.25rem; padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .field-group { display: flex; flex-direction: column; gap: 1rem; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .field-wrap { display: flex; flex-direction: column; gap: 0.4rem; }
    .field-label { font-size: 0.75rem; font-weight: 600; color: var(--fg); letter-spacing: 0.02em; }
    .field-input {
      border: 1.5px solid var(--border); border-radius: 0.625rem;
      padding: 0.75rem 0.875rem; font-family: var(--font); font-size: 0.9rem;
      color: var(--fg); background: var(--bg); outline: none; transition: border-color 0.2s; width: 100%;
    }
    .field-input:focus { border-color: var(--accent); background: var(--white); }
    .field-input::placeholder { color: var(--muted); }
    .field-input.error { border-color: var(--error); }

    /* Address autocomplete dropdown */
    .addr-wrap { position: relative; }
    .addr-dropdown {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 100;
      background: var(--white); border: 1.5px solid var(--border); border-radius: 0.75rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.09); overflow: hidden; display: none;
    }
    .addr-dropdown.open { display: block; }
    .addr-item {
      padding: 0.7rem 1rem; font-size: 0.875rem; cursor: pointer;
      border-bottom: 1px solid var(--border); transition: background 0.15s; line-height: 1.4;
    }
    .addr-item:last-child { border-bottom: none; }
    .addr-item:hover, .addr-item.active { background: #f0f5f0; color: var(--accent); }
    .addr-loading { padding: 0.7rem 1rem; font-size: 0.8rem; color: var(--muted); }

    #payment-element { margin-bottom: 1.5rem; }

    .pay-btn {
      width: 100%; background: var(--accent); color: white; border: none;
      padding: 1rem 1.5rem; border-radius: 100px; font-size: 1rem; font-weight: 700;
      cursor: pointer; font-family: var(--font); display: flex; align-items: center;
      justify-content: center; gap: 0.6rem; transition: background 0.2s, transform 0.15s; letter-spacing: -0.01em;
    }
    .pay-btn:hover:not(:disabled) { background: #1e4420; transform: translateY(-1px); }
    .pay-btn:active:not(:disabled) { transform: scale(0.98); }
    .pay-btn:disabled { opacity: 0.6; cursor: wait; }
    .pay-note { display: flex; align-items: center; justify-content: center; gap: 0.4rem; margin-top: 1rem; font-size: 0.72rem; color: var(--muted); text-align: center; }
    .error-msg { color: var(--error); font-size: 0.8rem; margin-top: 0.75rem; display: none; }
    .error-msg.visible { display: block; }

    .empty-checkout { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; padding: 4rem 2rem; text-align: center; grid-column: span 2; }
    .empty-checkout h2 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.03em; }
    .empty-checkout p { color: var(--muted); font-size: 0.9rem; }

    @media (max-width: 768px) {
      nav { padding: 1rem 1.25rem; }
      .nav-steps { display: none; }
      .checkout-grid { grid-template-columns: 1fr; }
      .summary-panel { padding: 2rem 1.25rem; border-right: none; border-bottom: 1px solid var(--border); }
      .payment-panel { padding: 2rem 1.25rem; }
      .field-row { grid-template-columns: 1fr; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-brand">Nine<span>2</span>Five</a>
    <div class="nav-steps">
      <span>Cart</span>
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M4 2l4 4-4 4" stroke="#C8BFB4" stroke-width="1.2" stroke-linecap="round"/></svg>
      <span class="step-active">Checkout</span>
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M4 2l4 4-4 4" stroke="#C8BFB4" stroke-width="1.2" stroke-linecap="round"/></svg>
      <span>Confirmation</span>
    </div>
    <a href="/#collection" class="nav-back">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M11 6.5H2M5.5 3L2 6.5l3.5 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to shop
    </a>
  </nav>

  <div class="checkout-grid" id="checkout-grid">

    <!-- ORDER SUMMARY -->
    <div class="summary-panel">
      <p class="summary-label">Order Summary</p>
      <div class="order-items" id="order-items"></div>
      <div class="summary-totals" id="summary-totals"></div>
      <div class="trust-badges">
        <div class="trust-badge">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1l1.5 4.5H13l-3.75 2.7 1.5 4.3L7 10l-3.75 2.5 1.5-4.3L1 5.5h4.5L7 1z" fill="var(--gold)"/></svg>
          <span>Secure checkout powered by Stripe</span>
        </div>
        <div class="trust-badge">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="4" width="12" height="9" rx="1.5" stroke="var(--muted)" stroke-width="1.2"/><path d="M4 4V3a3 3 0 1 1 6 0v1" stroke="var(--muted)" stroke-width="1.2"/></svg>
          <span>256-bit SSL encryption</span>
        </div>
        <div class="trust-badge">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7l4 4 6-7" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Ships from Aotearoa New Zealand</span>
        </div>
      </div>
    </div>

    <!-- CHECKOUT FORM -->
    <div class="payment-panel">

      <!-- 1. CONTACT -->
      <div class="form-section">
        <div class="form-section-title">Contact</div>
        <div class="field-group">
          <div class="field-row">
            <div class="field-wrap">
              <label class="field-label" for="first-name">First name</label>
              <input class="field-input" id="first-name" type="text" placeholder="Te Koha" autocomplete="given-name">
            </div>
            <div class="field-wrap">
              <label class="field-label" for="last-name">Last name</label>
              <input class="field-input" id="last-name" type="text" placeholder="Tūhoe" autocomplete="family-name">
            </div>
          </div>
          <div class="field-wrap">
            <label class="field-label" for="email">Email address</label>
            <input class="field-input" id="email" type="email" placeholder="you@example.com" autocomplete="email">
          </div>
          <div class="field-wrap">
            <label class="field-label" for="phone">Phone number</label>
            <input class="field-input" id="phone" type="tel" placeholder="+64 21 000 0000" autocomplete="tel">
          </div>
        </div>
      </div>

      <!-- 2. DELIVERY ADDRESS -->
      <div class="form-section">
        <div class="form-section-title">Delivery Address</div>
        <div class="field-group">
          <div class="field-wrap addr-wrap">
            <label class="field-label" for="address-line1">Street address</label>
            <input class="field-input" id="address-line1" type="text" placeholder="Start typing your address…" autocomplete="off">
            <div class="addr-dropdown" id="addr-dropdown"></div>
          </div>
          <div class="field-wrap">
            <label class="field-label" for="address-line2">Apartment, unit, suite (optional)</label>
            <input class="field-input" id="address-line2" type="text" placeholder="Apt 2B" autocomplete="address-line2">
          </div>
          <div class="field-row">
            <div class="field-wrap">
              <label class="field-label" for="suburb">Suburb</label>
              <input class="field-input" id="suburb" type="text" placeholder="Ponsonby" autocomplete="address-level3">
            </div>
            <div class="field-wrap">
              <label class="field-label" for="city">City / Town</label>
              <input class="field-input" id="city" type="text" placeholder="Auckland" autocomplete="address-level2" id="city">
            </div>
          </div>
          <div class="field-row">
            <div class="field-wrap">
              <label class="field-label" for="postcode">Postcode</label>
              <input class="field-input" id="postcode" type="text" placeholder="1011" autocomplete="postal-code">
            </div>
            <div class="field-wrap">
              <label class="field-label" for="country">Country</label>
              <select class="field-input" id="country" autocomplete="country">
                <option value="NZ">New Zealand</option>
                <option value="AU">Australia</option>
                <option value="US">United States</option>
                <option value="GB">United Kingdom</option>
                <option value="CA">Canada</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- 3. PAYMENT -->
      <div class="form-section">
        <div class="form-section-title">Payment</div>
        <div id="payment-element"></div>
        <div class="error-msg" id="error-msg"></div>
        <button class="pay-btn" id="pay-btn" disabled>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="4.5" width="14" height="10" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 4.5V3.5a3.5 3.5 0 1 1 7 0v1" stroke="currentColor" stroke-width="1.4"/><path d="M1 8h14" stroke="currentColor" stroke-width="1.4"/></svg>
          Loading…
        </button>
        <p class="pay-note">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="0.5" y="3.5" width="11" height="8" rx="1" stroke="currentColor" stroke-width="1"/><path d="M3 3.5V3a3 3 0 0 1 6 0v.5" stroke="currentColor" stroke-width="1"/></svg>
          Your payment is encrypted and secure. We never store card details.
        </p>
      </div>

    </div>
  </div>

  <script>
    const PUBLISHABLE_KEY = 'pk_live_51QQHA4CA9Ax2EtslOBniEN9i6ATir27Y4geLt4w5bkGC4IKW5G6CE6vpBG9gx1o27DvtjN20MFnG7MJdtOC66ts900FR0eil8l';
    const stripe = Stripe(PUBLISHABLE_KEY);
    let elements;
    const cart = JSON.parse(localStorage.getItem('n2f-cart') || '[]');

    if (cart.length === 0) {
      document.getElementById('checkout-grid').innerHTML = `
        <div class="empty-checkout">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none"><path d="M6 6h6l7.2 22.2a3 3 0 0 0 2.88 1.8h15.84a3 3 0 0 0 2.88-2.2L44 14H12" stroke="#C8BFB4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="42" r="3" fill="#C8BFB4"/><circle cx="36" cy="42" r="3" fill="#C8BFB4"/></svg>
          <h2>Your cart is empty</h2>
          <p>Add some socks before checking out.</p>
          <a href="/#collection" style="margin-top:1rem;background:var(--accent);color:white;padding:0.8rem 1.75rem;border-radius:100px;text-decoration:none;font-weight:600;font-size:0.9rem;">Browse Collection</a>
        </div>`;
    } else {
      renderSummary();
      initStripe();
      initAddressFinder();
    }

    function renderSummary() {
      const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
      document.getElementById('order-items').innerHTML = cart.map(item => `
        <div class="order-item">
          <div class="order-item-img">
            ${item.img ? `<img src="${item.img}" alt="${item.name}" loading="lazy">` : ''}
            <div class="qty-bubble">${item.qty}</div>
          </div>
          <div>
            <div class="order-item-name">${item.name}</div>
            <div class="order-item-meta">Size: ${item.size}</div>
          </div>
          <div class="order-item-price">$${(item.price * item.qty).toFixed(2)}</div>
        </div>`).join('');
      document.getElementById('summary-totals').innerHTML = `
        <div class="total-row"><span>Subtotal</span><span>$${subtotal.toFixed(2)} NZD</span></div>
        <div class="total-row"><span>Shipping</span><span style="color:var(--accent);font-weight:600">Calculated at next step</span></div>
        <div class="total-row grand"><span>Total</span><span>$${subtotal.toFixed(2)} NZD</span></div>`;
    }

    async function initStripe() {
      try {
        const res = await fetch('/api/payment-intent', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ items: cart }),
        });
        const { clientSecret, error } = await res.json();
        if (error) throw new Error(error);

        elements = stripe.elements({
          clientSecret,
          appearance: {
            theme: 'flat',
            variables: {
              fontFamily: "'Outfit', sans-serif", fontSizeBase: '15px',
              colorPrimary: '#2C5E2E', colorBackground: '#F6F2EC',
              colorText: '#1A1714', colorTextPlaceholder: '#8A7F74',
              colorDanger: '#c0392b', borderRadius: '10px', spacingUnit: '4px',
            },
            rules: {
              '.Input': { border: '1.5px solid #E2D9CE', padding: '12px 14px', backgroundColor: '#F6F2EC' },
              '.Input:focus': { border: '1.5px solid #2C5E2E', backgroundColor: '#FDFBF8', boxShadow: 'none' },
              '.Label': { fontWeight: '600', fontSize: '12px', letterSpacing: '0.02em', color: '#1A1714', marginBottom: '6px' },
            },
          },
        });

        const paymentElement = elements.create('payment', { layout: 'tabs' });
        paymentElement.mount('#payment-element');
        paymentElement.on('ready', () => {
          const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
          const btn = document.getElementById('pay-btn');
          btn.disabled = false;
          btn.innerHTML = `
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="4.5" width="14" height="10" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 4.5V3.5a3.5 3.5 0 1 1 7 0v1" stroke="currentColor" stroke-width="1.4"/><path d="M1 8h14" stroke="currentColor" stroke-width="1.4"/></svg>
            Pay $${total.toFixed(2)} NZD`;
        });
      } catch (err) {
        document.getElementById('error-msg').textContent = 'Could not load payment form. Please try again.';
        document.getElementById('error-msg').classList.add('visible');
      }
    }

    // ── Address autocomplete (Photon / OpenStreetMap — free, no key) ──
    let addrDebounce = null;
    let suggestions  = [];

    function initAddressFinder() {
      const input    = document.getElementById('address-line1');
      const dropdown = document.getElementById('addr-dropdown');

      input.addEventListener('input', () => {
        clearTimeout(addrDebounce);
        const q = input.value.trim();
        if (q.length < 3) { closeDropdown(); return; }
        addrDebounce = setTimeout(() => fetchSuggestions(q), 300);
      });

      input.addEventListener('keydown', e => {
        const items  = [...dropdown.querySelectorAll('.addr-item')];
        const active = dropdown.querySelector('.addr-item.active');
        let idx = items.indexOf(active);
        if (e.key === 'ArrowDown') { e.preventDefault(); items[Math.min(idx+1, items.length-1)]?.classList.add('active'); active?.classList.remove('active'); }
        if (e.key === 'ArrowUp')   { e.preventDefault(); items[Math.max(idx-1, 0)]?.classList.add('active'); active?.classList.remove('active'); }
        if (e.key === 'Enter' && active) { e.preventDefault(); active.click(); }
        if (e.key === 'Escape') closeDropdown();
      });

      document.addEventListener('click', e => { if (!e.target.closest('.addr-wrap')) closeDropdown(); });
      document.getElementById('country').addEventListener('change', () => {
        ['address-line1','address-line2','suburb','city','postcode'].forEach(id => document.getElementById(id).value = '');
        closeDropdown();
      });
    }

    async function fetchSuggestions(q) {
      const country  = document.getElementById('country').value;
      const dropdown = document.getElementById('addr-dropdown');
      dropdown.innerHTML = '<div class="addr-loading">Searching…</div>';
      dropdown.classList.add('open');

      // Only autocomplete for NZ and AU — others use browser autocomplete
      if (country !== 'NZ' && country !== 'AU') { closeDropdown(); return; }

      try {
        const cc  = country.toLowerCase();
        const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&lang=en&limit=7&countrycode=${cc}`;
        const res = await fetch(url);
        const data = await res.json();

        suggestions = (data.features || [])
          .map(f => {
            const p = f.properties;
            const num    = p.housenumber || '';
            const street = p.street || p.name || '';
            const line1  = num ? `${num} ${street}` : street;
            const suburb = p.suburb || p.district || p.quarter || '';
            const city   = p.city || p.town || p.village || p.county || '';
            const post   = p.postcode || '';
            if (!line1) return null;
            const label  = [line1, suburb, city, post].filter(Boolean).join(', ');
            return { label, line1, suburb, city, postcode: post };
          })
          .filter(Boolean);

        if (!suggestions.length) {
          dropdown.innerHTML = '<div class="addr-loading">No addresses found — type your address manually</div>';
          return;
        }

        dropdown.innerHTML = suggestions.map((s, i) =>
          `<div class="addr-item" data-idx="${i}">${s.label}</div>`
        ).join('');

        dropdown.querySelectorAll('.addr-item').forEach(el => {
          el.addEventListener('click', () => {
            const s = suggestions[+el.dataset.idx];
            document.getElementById('address-line1').value = s.line1;
            document.getElementById('suburb').value        = s.suburb;
            document.getElementById('city').value          = s.city;
            document.getElementById('postcode').value      = s.postcode;
            closeDropdown();
            document.getElementById('address-line2').focus();
          });
        });
      } catch (_) { closeDropdown(); }
    }

    function closeDropdown() {
      const d = document.getElementById('addr-dropdown');
      d.classList.remove('open');
      d.innerHTML = '';
    }

    // ── Submit ──
    document.getElementById('pay-btn').addEventListener('click', async () => {
      if (!elements) return;
      const firstName  = document.getElementById('first-name').value.trim();
      const lastName   = document.getElementById('last-name').value.trim();
      const email      = document.getElementById('email').value.trim();
      const phone      = document.getElementById('phone').value.trim();
      const line1      = document.getElementById('address-line1').value.trim();
      const line2      = document.getElementById('address-line2').value.trim();
      const city       = document.getElementById('city').value.trim();
      const postcode   = document.getElementById('postcode').value.trim();
      const country    = document.getElementById('country').value;
      const errorEl    = document.getElementById('error-msg');
      errorEl.classList.remove('visible');

      if (!firstName || !lastName) { return showError('Please enter your full name.', 'first-name'); }
      if (!email || !email.includes('@')) { return showError('Please enter a valid email address.', 'email'); }
      if (!line1) { return showError('Please enter your delivery address.', 'address-line1'); }
      if (!city)  { return showError('Please enter your city.', 'city'); }
      if (!postcode) { return showError('Please enter your postcode.', 'postcode'); }

      const btn = document.getElementById('pay-btn');
      btn.disabled = true;
      btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="animation:spin 1s linear infinite"><circle cx="8" cy="8" r="6" stroke="rgba(255,255,255,0.3)" stroke-width="2"/><path d="M8 2a6 6 0 0 1 6 6" stroke="white" stroke-width="2" stroke-linecap="round"/></svg> Processing…`;

      const { error } = await stripe.confirmPayment({
        elements,
        confirmParams: {
          return_url: `${window.location.origin}/success.html`,
          payment_method_data: {
            billing_details: {
              name: `${firstName} ${lastName}`,
              email,
              phone,
              address: { line1, line2: line2 || null, city, postal_code: postcode, country },
            },
          },
          shipping: {
            name: `${firstName} ${lastName}`,
            phone,
            address: { line1, line2: line2 || null, city, postal_code: postcode, country },
          },
          receipt_email: email,
        },
      });

      if (error) {
        errorEl.textContent = error.message || 'Payment failed. Please try again.';
        errorEl.classList.add('visible');
        const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
        btn.disabled = false;
        btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="4.5" width="14" height="10" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 4.5V3.5a3.5 3.5 0 1 1 7 0v1" stroke="currentColor" stroke-width="1.4"/><path d="M1 8h14" stroke="currentColor" stroke-width="1.4"/></svg> Pay $${total.toFixed(2)} NZD`;
      }
    });

    function showError(msg, fieldId) {
      const errorEl = document.getElementById('error-msg');
      errorEl.textContent = msg;
      errorEl.classList.add('visible');
      if (fieldId) document.getElementById(fieldId).classList.add('error');
    }

    ['first-name','last-name','email','phone','address-line1','city','postcode'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        document.getElementById(id).classList.remove('error');
        document.getElementById('error-msg').classList.remove('visible');
      });
    });
  </script>

</body>
</html>
